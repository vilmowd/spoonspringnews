# Optional. The site already starts a local Postgres if DATABASE_URL is empty.
# Use this file when you want a separate database server instead.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: folio
      POSTGRES_PASSWORD: folio
      POSTGRES_DB: folio
    ports:
      - "5432:5432"
    volumes:
      - folio_pg:/var/lib/postgresql/data

volumes:
  folio_pg:
